<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CivicAI - report civic issues with a photo, a description and your location. AI identifies, prioritises and routes every complaint to the right department." />
    <meta name="theme-color" content="#0B6E4F" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="CivicAI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CivicAI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <title>CivicAI - AI-Powered Civic Issue Management</title>
    <style>
      /* Page colour before the stylesheet loads (matches --c-bg), so dark mode never flashes white. */
      html { background: #eef1f0; }
      html.dark { background: #0f1617; }
    </style>
    <script>
      // Apply the saved theme before first paint (no flash of the wrong theme)
      try {
        var t = localStorage.getItem('civicai.theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px; max-width: 32rem">
        CivicAI needs JavaScript to run. Enable JavaScript in your browser settings and reload the page.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
