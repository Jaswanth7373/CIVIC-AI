[pytest]
# CivicAI end-to-end suite. Run from the repository root:  pytest e2e -v   (README.md has the full setup)
testpaths = .
python_files = test_*.py
addopts = -ra --strict-markers
markers =
    mutates: creates or changes data in the running system (complaints, users, settings); cleans up after itself
    ai: waits for the real AI pipeline (complaint analysis, resolution verification)
